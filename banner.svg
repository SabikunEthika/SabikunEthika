<svg width="1200" height="320" viewBox="0 0 1200 320"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Mauve Pink Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#100B12"/>
      <stop offset="0.45" stop-color="#21141E"/>
      <stop offset="1" stop-color="#3A1F32"/>
    </linearGradient>

    <!-- Mauve / Rose Accent -->
    <linearGradient id="accent" x1="100" y1="0" x2="1100" y2="320"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#B56B86"/>
      <stop offset="0.5" stop-color="#D58AA3"/>
      <stop offset="1" stop-color="#E9A6B8"/>
    </linearGradient>

    <!-- Animated Line -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B56B86" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E9A6B8"/>
      <stop offset="1" stop-color="#B56B86" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="42"
             height="42"
             patternUnits="userSpaceOnUse">
      <path
        d="M42 0H0V42"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.035"/>
    </pattern>

  </defs>


  <!-- ==================== BACKGROUND ==================== -->

  <rect
    width="1200"
    height="320"
    rx="20"
    fill="url(#bg)"/>

  <rect
    width="1200"
    height="320"
    rx="20"
    fill="url(#grid)"/>


  <!-- ==================== AMBIENT GLOW ==================== -->

  <circle
    cx="1030"
    cy="75"
    r="175"
    fill="#B56B86"
    fill-opacity="0.10"/>

  <circle
    cx="1080"
    cy="270"
    r="145"
    fill="#E9A6B8"
    fill-opacity="0.07"/>


  <!-- ==================== ANIMATED GLOW ==================== -->

  <circle
    cx="1020"
    cy="100"
    r="35"
    fill="#D58AA3"
    fill-opacity="0.13"
    filter="url(#softGlow)">

    <animate
      attributeName="r"
      values="30;50;30"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.25;0.55;0.25"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ==================== FLOATING CODE ==================== -->

  <g
    fill="#F3C7D3"
    font-family="monospace"
    opacity="0.18">

    <text x="830" y="70" font-size="24">
      &lt;/&gt;
    </text>

    <text x="1010" y="145" font-size="20">
      { }
    </text>

    <text x="900" y="235" font-size="18">
      01 10 01
    </text>

    <text x="1060" y="255" font-size="17">
      &gt;_
    </text>

  </g>


  <!-- ==================== MOVING STATUS ==================== -->

  <text
    x="750"
    y="285"
    fill="#D58AA3"
    font-family="monospace"
    font-size="13"
    opacity="0.25">

    building systems...

    <animate
      attributeName="opacity"
      values="0.1;0.45;0.1"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ==================== LEFT ACCENT ==================== -->

  <rect
    x="78"
    y="75"
    width="5"
    height="155"
    rx="3"
    fill="url(#accent)"/>


  <!-- ==================== NAME ==================== -->

  <text
    x="115"
    y="128"
    fill="#FFF7FA"
    font-family="Trebuchet MS, Arial, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="1.5">

    Sabikun Alam Ethika

    <animate
      attributeName="opacity"
      values="0.88;1;0.88"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


  <!-- ==================== DESIGNATION ==================== -->

  <text
    x="118"
    y="169"
    fill="#F1CBD6"
    font-family="Trebuchet MS, Arial, sans-serif"
    font-size="21"
    font-weight="400"
    letter-spacing="1">

    Computer Science &amp; Engineering Student

  </text>


  <!-- ==================== SPECIALIZATION ==================== -->

  <text
    x="118"
    y="201"
    fill="#C7A5B1"
    font-family="monospace"
    font-size="14"
    letter-spacing="0.8">

    FULL-STACK • AI/ML • PROBLEM SOLVING

  </text>


  <!-- ==================== ANIMATED SCANNER ==================== -->

  <rect
    x="115"
    y="222"
    width="480"
    height="2"
    rx="1"
    fill="url(#line)">

    <animate
      attributeName="x"
      values="115;400;115"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ==================== TERMINAL CARD ==================== -->

  <g transform="translate(815 78)">

    <rect
      width="275"
      height="145"
      rx="14"
      fill="#0C080D"
      fill-opacity="0.78"
      stroke="#D58AA3"
      stroke-opacity="0.28"/>


    <!-- Terminal dots -->

    <circle
      cx="22"
      cy="22"
      r="4"
      fill="#B56B86"/>

    <circle
      cx="39"
      cy="22"
      r="4"
      fill="#D58AA3"/>

    <circle
      cx="56"
      cy="22"
      r="4"
      fill="#E9A6B8"/>


    <!-- Terminal text -->

    <text
      x="22"
      y="58"
      fill="#D58AA3"
      font-family="monospace"
      font-size="13">

      &gt; building...

    </text>


    <text
      x="22"
      y="84"
      fill="#E8D5DC"
      font-family="monospace"
      font-size="13">

      &gt; learning...

    </text>


    <text
      x="22"
      y="110"
      fill="#E9A6B8"
      font-family="monospace"
      font-size="13">

      &gt; improving

      <animate
        attributeName="opacity"
        values="0.4;1;0.4"
        dur="2s"
        repeatCount="indefinite"/>

    </text>


    <text
      x="22"
      y="132"
      fill="#967783"
      font-family="monospace"
      font-size="11">

      status: active

    </text>

  </g>


  <!-- ==================== FLOATING PARTICLE 1 ==================== -->

  <circle
    cx="700"
    cy="65"
    r="2"
    fill="#D58AA3">

    <animate
      attributeName="cy"
      values="65;250;65"
      dur="8s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0;0.8;0"
      dur="8s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ==================== FLOATING PARTICLE 2 ==================== -->

  <circle
    cx="760"
    cy="250"
    r="2"
    fill="#E9A6B8">

    <animate
      attributeName="cy"
      values="250;55;250"
      dur="7s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0;0.7;0"
      dur="7s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ==================== BOTTOM ACCENT ==================== -->

  <rect
    x="115"
    y="255"
    width="500"
    height="2"
    rx="1"
    fill="url(#accent)"
    opacity="0.55"/>


  <!-- ==================== CORNER DETAILS ==================== -->

  <path
    d="M1100 35H1170"
    stroke="#D58AA3"
    stroke-opacity="0.45"
    stroke-width="2"/>

  <path
    d="M1135 50H1170"
    stroke="#E9A6B8"
    stroke-opacity="0.35"
    stroke-width="2"/>


  <!-- ==================== BORDER ==================== -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="318"
    rx="19"
    stroke="#D58AA3"
    stroke-opacity="0.20"
    stroke-width="2"/>

</svg>