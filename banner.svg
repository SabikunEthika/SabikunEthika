<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="accent" x1="150" y1="0" x2="1050" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>

  <!-- Grid -->
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Decorative glow -->
  <circle cx="1030" cy="55" r="150" fill="#6366F1" fill-opacity="0.10"/>
  <circle cx="1100" cy="230" r="120" fill="#A855F7" fill-opacity="0.08"/>

  <!-- Decorative code symbols -->
  <g opacity="0.18" fill="#C7D2FE" font-family="monospace">
    <text x="850" y="75" font-size="22">&lt;/&gt;</text>
    <text x="1000" y="145" font-size="18">{ }</text>
    <text x="900" y="220" font-size="20">01 10 01</text>
    <text x="1060" y="250" font-size="16">&gt;_</text>
  </g>

  <!-- Left accent line -->
  <rect x="90" y="82" width="5" height="135" rx="2.5" fill="url(#accent)"/>

  <!-- Main text -->
  <text
    x="125"
    y="125"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="700"
    letter-spacing="0.5">
    Sabikun Ethika
  </text>

  <!-- Designation -->
  <text
    x="128"
    y="163"
    fill="#C7D2FE"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="400"
    letter-spacing="0.8">
    Computer Science &amp; Engineering Student
  </text>

  <!-- Secondary text -->
  <text
    x="128"
    y="195"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="400"
    letter-spacing="0.5">
    Full-Stack Development • AI/ML • Problem Solving
  </text>

  <!-- Small decorative terminal -->
  <g transform="translate(820 88)">
    <rect
      width="250"
      height="125"
      rx="12"
      fill="#020617"
      fill-opacity="0.55"
      stroke="#818CF8"
      stroke-opacity="0.25"/>

    <!-- Terminal dots -->
    <circle cx="20" cy="20" r="4" fill="#818CF8" fill-opacity="0.8"/>
    <circle cx="36" cy="20" r="4" fill="#A78BFA" fill-opacity="0.7"/>
    <circle cx="52" cy="20" r="4" fill="#C084FC" fill-opacity="0.7"/>

    <!-- Terminal text -->
    <text
      x="20"
      y="55"
      fill="#818CF8"
      font-family="monospace"
      font-size="13">
      &gt; building...
    </text>

    <text
      x="20"
      y="78"
      fill="#CBD5E1"
      font-family="monospace"
      font-size="13">
      &gt; learning...
    </text>

    <text
      x="20"
      y="101"
      fill="#A78BFA"
      font-family="monospace"
      font-size="13">
      &gt; improving_
    </text>
  </g>

  <!-- Bottom accent -->
  <rect
    x="125"
    y="235"
    width="500"
    height="2"
    rx="1"
    fill="url(#accent)"
    opacity="0.65"/>

  <!-- Bottom-right decorative lines -->
  <path
    d="M1100 30 L1170 30"
    stroke="#818CF8"
    stroke-opacity="0.4"
    stroke-width="2"/>

  <path
    d="M1140 45 L1170 45"
    stroke="#C084FC"
    stroke-opacity="0.3"
    stroke-width="2"/>

  <!-- Outer border -->
  <rect
    x="1"
    y="1"
    width="1198"
    height="298"
    rx="17"
    stroke="#818CF8"
    stroke-opacity="0.18"
    stroke-width="2"/>

</svg>
